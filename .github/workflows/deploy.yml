name: Deploy SIMOPS Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v6
        with:
          repository: Alexqwesa/vsp_dsno
          ref: antoan
          path: src
          token: ${{ secrets.VSP_DSNO_PAT }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: src/vsp_dsno_flutter
        run: flutter pub get

      - name: Build Flutter web
        working-directory: src/vsp_dsno_flutter
        run: >
          flutter build web
          --release
          --target lib/main_static_site.dart
          --base-href /vsp-simops-static/
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/vsp_dsno_flutter/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
