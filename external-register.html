<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>SIMOPS external signer registration</title>
  <link rel="stylesheet" href="external-signing.css">
  <script src="external-register.js" defer></script>
</head>
<body>
  <main>
    <select id="language" aria-label="Language"><option value="en">English</option><option value="vi">Tiếng Việt</option><option value="ru">Русский</option></select>
    <h1 data-aloc="External signer registration|Đăng ký người ký ngoài VSP|Регистрация внешнего подписанта"></h1>
    <p data-aloc="SIMOPS is available on the VSP local network. Complete this form, download your request and send the file to your VSP coordinator. This page does not create an active account.|SIMOPS hoạt động trên mạng nội bộ VSP. Điền biểu mẫu, tải yêu cầu rồi gửi tệp cho điều phối viên VSP. Trang này chưa tạo tài khoản hoạt động.|SIMOPS работает в локальной сети ВСП. Заполните форму, скачайте заявку и передайте файл координатору ВСП. Эта страница не активирует учётную запись."></p>
    <form id="registration">
      <p><label><span data-aloc="Full name|Họ và tên|ФИО"></span><br><input name="fullName" autocomplete="name" required maxlength="200"></label></p>
      <p><label><span data-aloc="Company|Công ty|Компания"></span><br><input name="company" autocomplete="organization" required maxlength="200"></label></p>
      <p><label><span data-aloc="Position|Chức danh|Должность"></span><br><input name="position" autocomplete="organization-title" required maxlength="200"></label></p>
      <p><label><span data-aloc="Email|Email|Электронная почта"></span><br><input name="email" type="email" autocomplete="email" required maxlength="254"></label></p>
      <p data-aloc="VSP verifies your identity and signing authority. Every designated VSP approver must approve your profile before you receive a passkey enrollment invitation. No VSP password is needed.|VSP xác minh danh tính và quyền ký. Mọi người phê duyệt VSP được chỉ định phải phê duyệt hồ sơ trước khi bạn nhận lời mời đăng ký passkey. Không cần mật khẩu VSP.|ВСП проверяет личность и полномочия. Требуется согласие всех назначенных согласующих ВСП до приглашения на регистрацию ключа. Пароль ВСП не требуется."></p>
      <button type="submit" data-aloc="Download registration request|Tải yêu cầu đăng ký|Скачать заявку"></button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
