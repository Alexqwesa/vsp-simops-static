  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

<body>
  <style>
        body, html {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0e1514;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
        }

        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

      .kt-text {
          font-size: 10vw; /* Size relative to viewport width */
          font-weight: bold;
          color: #ffffff;
          position: relative;
          z-index: 2;
      }

      .bracket {
          position: absolute;
          font-size: 12vw; /* Adjusted relative to viewport width */
          color: #888888;
          animation: pulseOut 1.5s infinite ease-in-out;
          opacity: 0;
      }


        .bracket.left {
            left: -8vw;
        }

        .bracket.right {
            right: -8vw;
        }

        @keyframes pulseOut {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.1;
            }
            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }



  #ck-preloader {
    position: fixed; inset: 0; background: #0b0b0f; color: #eee;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 99999; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial;
  }
  #ck-title { margin-bottom: 12px; opacity: .9; }
  #ck-bar {
    width: min(420px, 80vw); height: 8px; background: #222; border-radius: 999px; overflow: hidden;
    box-shadow: inset 0 0 0 1px #333;
  }
  #ck-fill { height: 100%; width: 0%; background: #4da3ff; transition: width .15s linear; }
  #ck-sub { margin-top: 10px; font-size: 12px; color:#aaa; }
  .ck-hide { display: none !important; }

  </style>

<script src="flutter_bootstrap.js" defer></script>
